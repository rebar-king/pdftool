name: Auto Wake Up Streamlit

on:
  schedule:
    # 한국시간 매일 오전 6시 30분 (주말 포함)
    - cron: "30 6 * * *"
      timezone: "Asia/Seoul"

    # 한국시간 매일 오후 12시 10분 (주말 포함)
    - cron: "10 12 * * *"
      timezone: "Asia/Seoul"

  # GitHub에서 수동 실행 버튼 생성
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake up Streamlit
        run: python wake_up.py
